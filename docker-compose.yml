services:
  madm-app:
    build: .
    ports:
      - "8787:8787"
    volumes:
      # Persist the local Cloudflare simulation state (D1, R2, KV)
      - ./.wrangler:/app/.wrangler
      # Mount secrets file if needed (uncomment below)
      # - ./.dev.vars:/app/.dev.vars
    environment:
      # Pass environment variables needed for bindings or config
      # Note: Bindings (D1, R2) are handled by Wrangler, but other vars like API keys might be needed
      - NODE_ENV=production
    # restart: unless-stopped
